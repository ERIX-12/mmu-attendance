databases:
  - name: mmu-attendance-db
    databaseName: mmu_attendance
    user: mmu_user
    plan: free

services:
  - type: web
    name: mmu-attendance-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && python create_demo_users.py && gunicorn mmu_attendance.wsgi:application"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mmu-attendance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "4"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://mmu-attendance.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://mmu-attendance.vercel.app"

