# fly.toml app configuration file generated for mmu-attendance-backend
#
# See https://fly.io/docs/reference/configuration/ for information

app = "mmu-attendance-backend"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "8000"
  DEBUG = "False"
