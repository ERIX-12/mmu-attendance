# fly.toml app configuration file generated for mmu-attendance-backend on 2026-04-28T00:02:01+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mmu-attendance-backend'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DEBUG = 'False'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
